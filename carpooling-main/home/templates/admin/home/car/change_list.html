{% extends "admin/change_list.html" %}
{% load static %}

{% block content %}
<style>
.car-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
}

.car-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 14px;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    transition: transform .15s ease, box-shadow .15s ease;
}

.car-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
}

.car-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
}

.car-meta {
    font-size: 13px;
    color: #555;
}

.badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 12px;
    margin-top: 6px;
}

.badge-active {
    background: #e6f7ec;
    color: #1b7f3b;
}

.badge-inactive {
    background: #fdecea;
    color: #b42318;
}
</style>

<div class="car-grid">
    {% for car in cl.result_list %}
        <a href="{{ car.id }}/change/" style="text-decoration:none;color:inherit;">
            <div class="car-card">
                <div class="car-title">
                    {{ car.model_name }}
                </div>

                <div class="car-meta">
                    🚘 {{ car.license_plate }}<br>
                    📍 {{ car.location|title }}
                </div>
                {% if not car.is_active %}
                    <span class="badge badge-inactive">Inactive</span>
                {% else %}
                    <span class="badge badge-active">Available</span>
                {% endif %}
            </div>
        </a>
    {% endfor %}
</div>
{% endblock %}
