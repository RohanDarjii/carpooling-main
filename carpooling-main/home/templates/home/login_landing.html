{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Required</title>
    <style>
        body {
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-bottom: 10px; color: #1e293b; font-size: 24px; }
        p { color: #64748b; margin-bottom: 30px; font-size: 16px; }
        
        .btn-microsoft {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #2f2f2f;
            color: white;
            padding: 14px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
        }
        .btn-microsoft:hover { background-color: #000; }
        .icon { font-size: 18px; }
    </style>
</head>
<body>

    <div class="login-card">
        <div style="font-size: 40px; margin-bottom: 20px;">🚗</div>
        
        <h1>Carpooling</h1>
        <p>Please login to access the booking system.</p>

        <a href="{% provider_login_url 'microsoft' %}" class="btn-microsoft">
            <span class="icon">🪟</span> Sign in with Microsoft
        </a>
    </div>

</body>
</html>
